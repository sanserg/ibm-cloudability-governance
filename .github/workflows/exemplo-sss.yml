name: Exemplo src-exemplo-sss

on:
  push:
    branches: [main]

jobs:
  rodar-exemplo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar o script de exemplo
        run: python src-exemplo-sss/ola.py
